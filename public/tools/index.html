<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tools - Pixelstream</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Pixelstream" />
  <meta property="og:image" content="https://pixelstream.vercel.app/assets/meta/meta_dark.png">
  <meta property="og:description" content="Watch your favorite movies and tv shows" />

  <script src="https://kit.fontawesome.com/60a2eca232.js" crossorigin="anonymous" defer></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.2.8/index.min.css">
  <link rel="stylesheet" href="../styles.css" type="text/css">
  <link rel="stylesheet" href="../media.css" media="(max-width: 767px)" type="text/css">
  <script src="../utils.js" defer></script>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png">

  <link rel="stylesheet" href="styles.css" type="text/css">
  <script src="script.js" defer></script>
</head>

<body>
  <script>0</script>
  <header id="header"></header>

  <main id="main-content">
    
    <section class="Download-links">
      <div class="form-container">
        <h1>EXTRACTOR</h1>
  
        <form id="form">
          <div class="form-group">
            <label>Media Type</label>
            <select id="mediaType" onchange="toggleFields()">
              <option value="movie">Movie</option>
              <option value="tv">TV</option>
            </select>
          </div>
          <div class="form-group">
            <label>Server</label>
            <select id="server-key" title="Alpha (recommended) - Fast results. Good for downloading.&#013;Bravo - Slow results. Good for streaming with vlc, mpv or other video player. ">
              <option value="alpha">Alpha</option>
              <option value="bravo">Bravo</option>
            </select>
          </div>
          <div class="form-group">
            <label>Name</label>
            <!-- <div id="search-field"> -->
              <div id="search-field">
                <input type="text" id="name" placeholder="e.g., Silo or Dune">
                <button class="x-icon" onclick="resetNameEntry()">
                  <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
              </div>
            <!-- </div> -->
          </div>
          <div class="form-group">
            <label>Size Limit (GB)</label>
            <div class="number-control">
              <button type="button" onclick="changeValue('maxsize', -0.1)">−</button>
              <button type="button" onclick="changeValue('maxsize', 0.1)">+</button>
              <input id="maxsize" value="12" placeholder="No Limit" min="0" inputmode="decimal">
            </div>
          </div>
          <div class="tv-input form-group">
            <label>Season (required)</label>
            <div class="number-control">
              <button type="button" onclick="changeValue('season', -1)">−</button>
              <button type="button" onclick="changeValue('season', 1)">+</button>
              <input id="season" value="1" placeholder="0" min="1" inputmode="numeric">
            </div>
          </div>
          <div class="tv-input form-group hidden">
            <label>Episode (optional)</label>
            <div class="number-control">
              <button type="button" onclick="changeValue('episode', -1)">−</button>
              <button type="button" onclick="changeValue('episode', 1)">+</button>
              <input id="episode" placeholder="0" min="1" inputmode="numeric">
            </div>
          </div>
          <div id="year-input" class="form-group">
            <label>Release Year</label>
            <div class="number-control">
              <button type="button" onclick="changeValue('year', -1)">−</button>
              <button type="button" onclick="changeValue('year', 1)">+</button>
              <input id="year" placeholder="eg. 2025" min="1872" value="" inputmode="numeric">
            </div>
          </div>
          <div class="form-actions">
            <button id="scrape">Generate</button>
            <button id="reset">Reset</button>
          </div>
        </form>
      </div>
    
      <div class="results-container">
        <h3>Links</h3>
        <div id="status-info"></div>
        <div id="results" class="results-table"></div>
      </div>
    
      <details class="raw-output">
        <summary>Raw Response</summary>
        <pre id="output"></pre>
      </details>
    </section>
  </main>

  <nav class="bottom-bar"></nav>

</body>

</html>
