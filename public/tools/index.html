<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tools - Pixelstream</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Pixelstream" />
  <meta property="og:image" content="https://pixelstream.vercel.app/assets/meta/meta_dark.png">
  <meta property="og:description" content="Watch your favorite movies and tv shows" />

  <script src="https://kit.fontawesome.com/60a2eca232.js" crossorigin="anonymous" defer></script>


  <link rel="stylesheet" href="../styles.css" type="text/css">
  <link rel="stylesheet" href="../media.css" type="text/css">
  <script src="../utils.js" defer></script>
  <link rel="icon" href="../assets/icons/favicon.png" type="image/png">

  <link rel="stylesheet" href="styles.css" type="text/css">
  <script src="script.js" defer></script>
</head>

<body>
  <script>0</script>
  <header id="header">
    <nav>
        <ul>
            <li><a href="/"></a></li>
            <li><a href="/movie">Movies</a></li>
            <li><a href="/tv">TV Shows</a></li>
            <li><a href="/#discover-streaming">What's Streaming</a></li>
            <li><a href="#">Tools</a></li>
            <li><a href="/library">Library</a></li>
            <form class="search-bar" onsubmit="return handleSearch(event)">
                <input type="search" id="search-input" placeholder="Search" />
                <i class="search-icon fa-solid fa-magnifying-glass"></i>
                <button type="reset" class="x-icon" id="search-button"><!-- onclick="handleSearch(event)" -->
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </form>

        </ul>
    </nav>
  </header>

  <main id="main-content">
    
    <section class="Download-links">
      <div class="form-container">
        <h1>EXTRACTOR</h1>
  
        <form id="form" style="display: grid; gap:inherit">
          <div class="flow-row">
            <div class="form-group form-control">
              <label>Media Type</label>
              <select id="mediaType" onchange="toggleFields()">
                <option value="movie">Movie</option>
                <option value="tv">TV</option>
              </select>
            </div>
      
            <div class="form-group form-control">
              <label>Server</label>
              <select id="server-key">
                <option value="alpha">Datadiff</option>
                <option value="bravo">UHDscrapper</option>
              </select>
            </div>
          </div>
      
          <div class="flow-row">
            <div class="form-group form-control">
              <label>Name</label>
              <input type="text" id="name" placeholder="e.g., Silo or Dune ">
            </div>
            <div class="form-group">
              <label>Size Limit (GB)</label>
              <div class="number-control">
                <button type="button" onclick="changeValue('maxsize', -0.1)">−</button>
                <button type="button" onclick="changeValue('maxsize', 0.1)">+</button>
                <input id="maxsize" value="10" placeholder="No Limit" min="0">
              </div>
            </div>
          </div>
        
          <!-- These fields are initially hidden for 'movie' type -->
          <div id="tv-input">
            <div class="form-group form-control">
              <label>Season (required)</label>
              <div class="number-control">
                <button type="button" onclick="changeValue('season', -1)">−</button>
                <button type="button" onclick="changeValue('season', 1)">+</button>
                <input id="season" value="1" placeholder="0" min="1" >
              </div>
            </div>
        
            <div class="form-group form-control">
              <label>Episode (optional)</label>
              <div class="number-control">
                <button type="button" onclick="changeValue('episode', -1)">−</button>
                <button type="button" onclick="changeValue('episode', 1)">+</button>
                <input id="episode" placeholder="0" min="1">
              </div>
            </div>
          </div>
        
          <!-- This field is initially hidden for 'tv' type -->
          <div id="year-input" class="form-group form-control">
            <label>Year (for movies)</label>
            <div class="number-control">
              <button type="button" onclick="changeValue('year', -1)">−</button>
              <button type="button" onclick="changeValue('year', 1)">+</button>
              <input id="year" placeholder="Year" min="0" value="2025">
            </div>
          </div>
        
          <div class="form-actions">
            <button id="scrape">Generate</button>
            <button id="reset">Reset</button>
          </div>
        </form>
        
      </div>
    
      <div class="results-container">
        <h3>Links</h3>
        <div id="status-info"></div>
        <div id="results" class="results-table"></div>
      </div>
    
      <details class="raw-output">
        <summary>Raw Response</summary>
        <pre id="output"></pre>
      </details>
    </section>
  </main>

  <nav class="bottom-bar"></nav>

</body>

</html>
