<!DOCTYPE html>
<html lang="en">

<head>
  <title>Sports | Pixelstream</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Pixelstream" />
  <meta property="og:image" content="https://pixelstream.vercel.app/assets/meta/meta_dark.png">
  <meta property="og:description" content="Watch live sports transmissions" />

  <script src="https://kit.fontawesome.com/60a2eca232.js" crossorigin="anonymous"></script>

  <!-- local items -->
  <link rel="stylesheet" href="styles.css" type="text/css">
  <link rel="stylesheet" href="../css/base.css" type="text/css">
  <link rel="stylesheet" href="../css/utils.css" type="text/css">
  <link rel="stylesheet" href="../css/components.css" type="text/css">
  <link rel="stylesheet" href="../css/styles.css" type="text/css">
  <link rel="stylesheet" href="../css/media.css" media="(max-width: 767px)" type="text/css">
  <link rel="icon" href="https://pixelstream.vercel.app/assets/icons/favicon.png" type="image/png">
  <script src="app.js" defer></script>
  <script src="../utils.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>   

  <!-- Top Navbar -->
  <nav id="top-bar"></nav>
  
  <main class="main-container" id="main-layout">
    
    <div class="top-control">
      <!-- Cyber Command Search Input -->
      <div class="cyber-search-wrapper">
        <span class="search-prefix">&gt; SEARCH_NODES:</span>
        <input type="text" id="stream-search-input" placeholder="TYPE TEAM, LEAGUE OR SPORT..." autocomplete="off" spellcheck="false">
      </div>

      <!-- Categories Navigation -->
      <div class="categories-container" id="categories-bar">
        <button class="category-btn active" onclick="filterCategory('all', this)">Loading</button>
      </div>
    </div>
    
    <!-- Terminal Player Display -->
    <div class="video-player-wrapper" id="player-wrapper">
        <div class="player-controls">
            <span class="now-playing-badge" id="player-badge">TRANSMISSION</span>
            <div class="control-buttons">
              <button id="btn-reload" onclick="reloadPlayer()" title="Reload Signal">
                  <i class="fa-solid fa-repeat"></i>
              </button>
              <button id="btn-minimize" class="minimize" onclick="toggleMiniPlayer()" title="Dock Mini HUD">
                <i class="fa-solid fa-picture-in-picture"></i>
              </button>
              <button id="btn-close" onclick="closePlayer()" title="Terminate Stream">
                <i class="fa-solid fa-xmark"></i>
              </button>
          </div>
        </div>

        <div class="iframe-container">
            <iframe id="live-player" src="" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>   
        </div>

        <!-- Dynamic Source Switcher Bar -->
        <div class="source-selector-bar" id="player-sources">
            <!-- Dynamically populated stream sources -->
        </div>

        <div class="player-info">
            <h2 id="player-title">Awaiting Signal...</h2>
            <p id="player-league">Select a broadcast below</p>
        </div>
    </div>

    <!-- Streams Display Section -->
    <!-- Streams Display Section -->
    <div class="streams-section">

        <!-- Live Streams Group -->
        <div class="stream-group collapsible-group" id="live-stream-group">
            <div class="stream-group-header" id="live-group-header">
                <h2 class="streams-title" id="live-title">
                    LIVE_NOW <span class="stream-count" id="live-count">[0]</span>
                </h2>
                <button class="cyber-toggle-btn" id="live-toggle-btn" type="button" aria-label="Toggle Live Streams">
                    <span class="btn-symbol">[ − ]</span>
                </button>
            </div>
            <div class="streams-grid" id="live-streams-display">
                <div class="no-streams">Querying live systems...</div>
            </div>
        </div>

        <!-- Upcoming Streams Group -->
        <div class="stream-group collapsible-group" id="upcoming-stream-group">
            <div class="stream-group-header" id="upcoming-group-header">
                <h2 class="streams-title" id="upcoming-title">
                    UPCOMING <span class="stream-count" id="upcoming-count">[0]</span>
                </h2>
                <button class="cyber-toggle-btn" id="upcoming-toggle-btn" type="button" aria-label="Toggle Upcoming Streams">
                    <span class="btn-symbol">[ − ]</span>
                </button>
            </div>
            <div class="upcoming-container" id="upcoming-streams-display">
                <div class="no-streams">Querying scheduled events...</div>
            </div>
        </div>

    </div>
  </main>
      
  <nav id="bottom-bar"></nav>
</body>
</html>
