<!DOCTYPE html>
<html lang="en">

  <head>
    <title>Home | Pixelstream</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Pixelstream" />
    <meta property="og:image" content="https://pixelstream.vercel.app/assets/meta/meta_dark.png">
    <meta property="og:description" content="Watch your favorite movies and tv shows" />

    <script src="https://kit.fontawesome.com/60a2eca232.js" crossorigin="anonymous"></script>

    <!-- local items -->
    <link rel="stylesheet" href="styles.css" type="text/css">

    <link rel="stylesheet" href="../css/base.css" type="text/css">
    <link rel="stylesheet" href="../css/utils.css" type="text/css">
    <link rel="stylesheet" href="../css/components.css" type="text/css">
    <link rel="stylesheet" href="../css/styles.css" type="text/css">
    <link rel="stylesheet" href="../css/media.css" media="(max-width: 767px)" type="text/css">
    <link rel="icon" href="https://pixelstream.vercel.app/assets/icons/favicon.png" type="image/png">
    <script src="app.js" defer></script>
    <script src="../utils.js" defer></script>
  </head>

  <body>   
  
  <script>0</script>
  <!-- Top Navbar -->
  <nav id="top-bar"></nav>
  
  <main class="main-container" id="main-layout">
    <div class="top-control">
      <div class="categories-container" id="categories-bar">
      <button class="category-btn active" onclick="filterCategory('all', this)">All</button>
      </div>
    </div>
          <div class="video-player-wrapper" id="player-wrapper">
              <div class="player-controls">
                  <span class="now-playing-badge">Now Playing</span>
                  <div class="control-buttons">
                      <button id="btn-minimize" onclick="toggleMiniPlayer()" title="Minimize / Expand">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                      </button>
                      <button id="btn-close" onclick="closePlayer()" title="Close Player">
                          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                      </button>
                  </div>
              </div>

              <div class="iframe-container">
                  <iframe id="live-player" src="" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
              </div>
              <div class="player-info">
                  <h2 id="player-title" style="font-size: 1.2rem;">Select a stream below</h2>
                  <p id="player-league" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;"></p>
              </div>
          </div>

          <div class="streams-section">
              <h2 style="margin-bottom: 15px; font-size: 1.3rem;">Live Now</h2>
              <div class="streams-grid" id="live-streams-display">
                  <div class="no-streams">Loading live events...</div>
              </div>

              <h2 style="margin-top: 40px; margin-bottom: 15px; font-size: 1.3rem;">Upcoming Events</h2>
              <div class="streams-grid" id="upcoming-streams-display">
                  <div class="no-streams">Loading upcoming events...</div>
              </div>
          </div>
  </main>
      
  <nav id="bottom-bar">
    <!-- Dynamic bootom bar -->
  </nav>
  </body>
</html>
