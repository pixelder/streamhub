<!DOCTYPE html>
<html lang="en">

<head>
  <title>Your Lists | Pixelstream</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Pixelstream" />
  <meta property="og:image" content="https://pixelstream.vercel.app/meta/meta_dark.png">
  <meta property="og:description" content="Watch your favorite movies and tv shows" />
  <script src="https://kit.fontawesome.com/60a2eca232.js" crossorigin="anonymous" preload></script>

  <link rel="icon" href="../assets/icons/favicon.png" type="image/png">

  <!-- Global files -->
  <link rel="stylesheet" href="../css/base.css" type="text/css">
  <link rel="stylesheet" href="../css/utils.css" type="text/css">
  <link rel="stylesheet" href="../css/components.css" type="text/css">
  <link rel="stylesheet" href="../css/styles.css" type="text/css">
  <link rel="stylesheet" href="../css/media.css" media="(max-width: 767px)" type="text/css">
  <script src="../utils.js" defer></script>
  <script src="../history.js" defer></script>
  <script src="../listeners.js" defer></script>
  
  <!-- local files -->
  <link rel="stylesheet" href="styles.css" type="text/css">
  <!--<link rel="stylesheet" href="media.css" type="text/css">  -->
  <script src="library.js" defer></script>


</head>

<body>
  <script>0</script>
  <!-- Top Navbar -->
  <nav id="top-bar"></nav>

  <!-- Body Content -->
  <main id="main-content">
    <section id="continue-watching" class="user-content hr-grid-view expandable" data-type="watching">
      <div class="section-header">
        <h2>Continue Watching</h2>
        <div class="select-action">
          <label class="select-all selectable">
              <input type="checkbox" />
              <span class="checkbox-button">
                <i class="fa-regular fa-square active"></i>
                <i class="fa-solid fa-square-check passive"></i>
              </span>
          </label>
          <div class="v-separator"></div>
          <div class="selection-count"><p></p></div>
        </div>
        <div class="actions">
          <button class="delete-button">
              <i class="fa-solid fa-trash-can"></i>
          </button>
          <button class="edit-button">
              <i class="fa-solid fa-pen-to-square active"></i>
              <i class="fa-solid fa-xmark"></i>
          </button>
          <!-- <div class="expand-arrow">
            <i class="fa-solid fa-chevron-left"></i>
          </div> -->
          <div class="maximize" tabindex="0">
            <i class="fa-solid fa-angle-right"></i>
          </div>
          <div class="close-window" tabindex="0">
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
      </div>
      <div class="grid-container" tabindex="-1"></div>
    </section>
    <section id="history" class="user-content hr-grid-view expandable" data-type="history">
      <div class="section-header">
        <h2>History</h2>
        <div class="select-action">
          <label class="select-all selectable">
              <input type="checkbox" />
              <span class="checkbox-button">
                <i class="fa-regular fa-square active"></i>
                <i class="fa-solid fa-square-check passive"></i>
              </span>
          </label>
          <div class="v-separator"></div>
          <div class="selection-count"><p></p></div>
        </div>
        <div class="actions">
          <button class="delete-button">
              <i class="fa-solid fa-trash-can"></i>
          </button>
          <button class="edit-button">
              <i class="fa-solid fa-pen-to-square active"></i>
              <i class="fa-solid fa-xmark"></i>
          </button>
          <!-- <div class="expand-arrow">
            <i class="fa-solid fa-chevron-left"></i>
          </div> -->
          <div class="maximize" tabindex="0">
            <i class="fa-solid fa-angle-right"></i>
          </div>
          <div class="close-window" tabindex="0">
            <i class="fa-solid fa-xmark"></i>
          </div>
        </div>
      </div>
      <div class="grid-container loading" tabindex="-1">
        <div class="filler">
            <div class="message">
              <div style="height: 100%; aspect-ratio: 1 / 1; mask: url(/assets/icons/bars-rotate-fade.svg) no-repeat center; background: var(--font-color3);"></div>
              <h4>Loading...</h4>
            </div>
        </div>
        <div class="empty">
          <div class="icon">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </div>
          <div class="message">
            <h4>No History</h4>
          </div>
        </div>
      </div>
    </section>
    <section id="bookmarks" class="user-content" data-type="bookmarks">
      <div class="section-header">
        <h2>Your Bookmarks</h2>
        <div class="actions">
        </div>
      </div>
      <div class="grid-container loading" tabindex="-1">
        <div class="filler">
            <div class="message">
              <div style="height: 100%; aspect-ratio: 1 / 1; mask: url(/assets/icons/bars-rotate-fade.svg) no-repeat center; background: var(--font-color3);"></div>
              <h4>Loading...</h4>
            </div>
        </div>
        <div class="empty">
          <div class="icon">
            <i class="fa-solid fa-book-bookmark"></i>
          </div>
          <div class="message">
            <h4>No Saves Yet</h4>
          </div>
        </div>
      </div>
    </section>
    <div class="modal-overlay"></div>
    <div id="info-modal" class="modal">
      <div class="modal-content">
        <div tabindex="0" id="modal-details">
          <!-- Dynamic content will be injected here -->
        </div>
      </div>
    </div>
    <div class="library-control button-container detach">
      <button id="control-menu-button">
        <i class="fa-solid fa-gear"></i>
      </button>
      <div class="control-modal modal">
        <div>
          <h2>Import & Export</h2>
        </div>
        <div class="import-export">
          <div class="import">
            <div>
              <h4>Import</h4>
              <p>Import data from a backup file.</p>
              <label for="merge-option">
                <input type="checkbox" id="merge-option" style="max-width: 16px;" checked>
                <p>Merge existing data with import data.</p>
              </label>
            </div>
            <button id="import">
              <i class="fa-solid fa-file-import"></i>
            </button>
            <input type="file" id="import-file" accept=".json" hidden>
          </div>
          <div class="export">
            <div>
              <h4>Export</h4>
              <p>Export a backup as a .json file.</p>
            </div>
            <button id="export">
              <i class="fa-solid fa-file-export"></i>
            </button>
          </div>
        </div>
        <div>
          <h2>Erase data</h2>
          <p>Warning: This action is irreversible.</p>
        </div>
        <div class="clear-all">
          <button id="clear-all">
            <i class="fa-solid fa-trash-can"></i>
            Clear
          </button>
        </div>
      </div>
    </div>
  </main>
  <nav id="bottom-bar">
    <!-- Dynamic bootom bar -->
  </nav>
  <footer>
    <!-- Dynamic bootom bar -->
  </footer>
</body>

</html>
